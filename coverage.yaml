# Questions `perch coverage` asks. Same grammar as scan.yaml.
# Every request is shaped as a scan's is: the unit asked about, `test` or `method`, with its source under the comment above it and
# no line numbers, then `graph`, the code around it as nodes and the calls between them as edges.
# A test's graph holds the code it reaches, nearest first, and the helpers of its own it calls through; the test also carries its
# `mocks` and the network and database calls perch found along its reach (`reachable_io`), with the methods that make them in
# its graph.
# A method is asked about one mutant its tests let survive, after perch ran them: `mutation` is the edit, `edit` saying what
# changed, `original` the code as written and `mutated` as changed, and its graph holds the method's callers. `matters` is asked
# once per survivor.
# infra is asked only of a test with a network or database call in reach.

- name: matters
  each: method
  where: "**/*"
  ask: >
    `mutation` is one edit to `method`: `edit` says what changed. For some input a caller could pass, does the changed method
    return a different value, raise, or leave different state behind, so that the change is a defect a caller could observe?
  "true": "It is a defect: for some input a caller could pass, the result, an error, or the state left behind differs"
  "false": "Nothing a caller could observe changes: the two spellings are equivalent, or the edit only affects logging or wording a caller ignores"

- name: infra
  each: test
  where: "**/*"
  ask: >
    `reachable_io` lists the network and database calls in the code `test` can reach; a call behind a branch its inputs do not
    take is not made. Following what `test` passes, without a mock in its `mocks` cutting it off, does running it make one of
    them to a real service, rather than to a server or database it starts itself on localhost?
  "true": It calls a live network service or database, so it fails when that service is down and can change its data
  "false": None of those calls is made with what it passes, or each goes to something it started itself or is mocked
