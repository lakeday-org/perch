# Questions `perch coverage` asks. Same grammar as scan.yaml.
# A test is asked with its own numbered source, the helpers in its own test code it calls through (`helpers`), what it mocks, the
# methods it reaches (`reaches`, direct first) and the kinds of I/O perch found on calls along that reach (`touches`). A method is asked with its numbered source, its branch lines, and
# the useful tests that reach it with the behavior each one decides.
# gap_line's options are the method's own branch lines, added when it is asked; `none` is the only option written here.
# tests_nothing_here, repeats and needs_test are asked only of a unit the call graph or the coverage report already flagged,
# and decide whether that problem is listed.

- name: decides
  type: choice
  each: test
  where: "**/*"
  ask: >
    Which behavior of the methods in `reaches` does `test` decide? Read its assertions: what would have to change in the
    code under test for this test to fail?
  options:
    happy_path: It checks the ordinary result for ordinary input
    empty_or_absent_input: It checks what happens on empty, null, missing or zero input
    boundary: It checks a value at or next to the edge of a range, a limit or a threshold
    error_path: It checks that an error is raised, returned or reported
    invalid_input: It checks that malformed or out-of-contract input is rejected
    state_after_call: It checks state left behind by the call, such as a stored record or a changed field
    ordering: It checks the order of results or of calls
    nothing: No change to the code under test would make it fail

- name: smell
  type: choice
  each: test
  where: "**/*"
  ask: What is most wrong with `test` as a test of the methods in `reaches`, if anything?
  options:
    none: Nothing; it drives the code under test and asserts on what that code produced
    asserts_mock: It asserts on a value it stubbed or mocked itself, so the code under test is not what is checked
    no_assertion: It asserts nothing, so it passes whatever the code does, short of throwing
    tautology: The expected value is computed by the same logic as the code under test
    assertion_roulette: Many unrelated assertions, so a failure does not say which behavior broke
    mystery_guest: It depends on a file, record or service that the test does not create
    eager: It drives several methods and asserts on only one of them
    dead_setup: It builds data that no assertion reads

- name: infra
  each: test
  where: "**/*"
  ask: >
    Through what `test` runs and what it reaches without a mock in `mocks` cutting it off, does it open a socket, a database
    connection, a file or a subprocess, or read a credential or setting from the environment?
  "true": Running it touches the network, a database, the filesystem, a process or the environment
  "false": Everything it runs stays in memory, or whatever would leave it is mocked

- name: tests_nothing_here
  each: test
  where: "**/*"
  ask: >
    None of the calls `test` makes resolve to a method in this repository. Does it check nothing of this repository's own
    code, only a library, the language, or values it built itself?
  "true": It checks nothing this repository wrote
  "false": It does exercise this repository's code, through calls perch could not follow

- name: repeats
  each: test
  where: "**/*"
  ask: >
    `test` calls the same code as `earlier`, and both decide the same kind of behavior. Does `test` check a case `earlier` already
    checks, with the same kind of input and the same expected result, so deleting `test` leaves no case unchecked?
  "true": It checks a case `earlier` already checks, and deleting it loses nothing
  "false": It checks a case `earlier` does not, such as other input, another boundary or another expected result

- name: cost
  type: score
  each: test
  where: "**/*"
  ask: How expensive is `test` to run, from what it and the code in `reaches` do?
  levels:
    - In memory only
    - Builds large fixtures, or loops over many cases
    - Touches disk, a process, or the clock
    - Touches the network or a database

- name: exercised
  type: score
  each: method
  where: "**/*"
  ask: >
    Of the branches of `method` (its `branches` lines), how many do the tests in `tests` take between them, judging from the
    inputs each test passes?
  levels:
    - None of them
    - Under half
    - About half
    - Most
    - Every branch

- name: gap_line
  type: choice
  each: method
  where: "**/*"
  ask: >
    Which branch line of `method` does no test in `tests` take? Pick the one whose untaken side matters most to a caller.
  options:
    none: Every branch line is taken by at least one shown test

- name: gap_kind
  type: choice
  each: method
  where: "**/*"
  ask: What kind of input would a test need to take the branch no test in `tests` takes?
  options:
    boundary: A value at or next to the edge of a range, a limit or a threshold
    empty_or_absent_input: Empty, null, missing or zero input
    error_path: Input or a dependency that makes the method raise, return or report an error
    invalid_input: Malformed or out-of-contract input
    state_after_call: A prior state that sends the call down another path
    ordering: Calls or items in a different order

- name: needs_test
  each: method
  where: "**/*"
  ask: >
    No test runs `method` (`untested` says how perch knows). Would a mistake in it reach a caller or a user, so that it needs
    a unit test?
  "true": A mistake in it would reach a caller or a user, and a unit test would catch it
  "false": It is trivial glue, an entry or build script, or code a test would only restate
