# Questions `perch coverage` asks. Same grammar as scan.yaml.
# Every request is shaped as a scan's is: the unit asked about, `test` or `method`, with its source under the comment above it and
# no line numbers, then `graph`, the code around it as nodes and the calls between them as edges.
# A test's graph holds the code it reaches, nearest first, and the helpers of its own it calls through; the test also carries its
# `mocks` and the network and database calls perch found along its reach (`reachable_io`), with the methods that make them in
# its graph.
# A method is asked about one planted bug at a time: `mutation` is one line of it changed, `original` as written and `mutated`
# as changed, and its graph holds the tests that reach it, each noted `test 1`, `test 2` and so on. `catches` is asked once per
# test shown, as `catches_1`, `catches_2` and so on, naming the test; `matters` once per mutation.
# infra and needs_test are asked only of a unit the call graph already flagged.

- name: catches
  each: method
  where: "**/*"
  ask: >
    `method` is shown as written, and `mutation` is one line of it changed: `original` is the line as written and `mutated` is
    the line as changed. Follow the inputs the named test passes through the code it reaches in `graph`. Run against the
    changed method, would that test fail?
  "true": "It fails: with the change, an assertion or expectation it makes no longer holds, or the call raises"
  "false": "It still passes: with the inputs it passes, the changed line gives the same result, or nothing it checks depends on that line"

- name: matters
  each: method
  where: "**/*"
  ask: >
    `mutation` is one line of `method` changed. For some input a caller could pass, does the changed method return a different
    value, raise, or leave different state behind, so that the change is a bug a caller could observe?
  "true": "It is a bug: for some input a caller could pass, the result, an error, or the state left behind differs"
  "false": "Nothing a caller could observe changes: the two spellings are equivalent, or the line only affects logging or wording a caller ignores"

- name: infra
  each: test
  where: "**/*"
  ask: >
    `reachable_io` lists the network and database calls in the code `test` can reach; a call behind a branch its inputs do not
    take is not made. Following what `test` passes, without a mock in its `mocks` cutting it off, does running it make one of
    them to a real service, rather than to a server or database it starts itself on localhost?
  "true": It calls a live network service or database, so it fails when that service is down and can change its data
  "false": None of those calls is made with what it passes, or each goes to something it started itself or is mocked

- name: needs_test
  each: method
  where: "**/*"
  ask: >
    No test runs `method` (its `note` says how perch knows). Would a mistake in it reach a caller or a user, so that it needs
    a unit test?
  "true": A mistake in it would reach a caller or a user, and a unit test would catch it
  "false": It is trivial glue, an entry or build script, or code a test would only restate
