<title id="title">Perch on ReviewBench</title>
<desc id="desc">Recall on ReviewBench for perch beside the reviewers on its leaderboard, highest first, and what a pull request costs. Laude RevEngine Prime: 46.3%, not published. Perch · OpenAI Decisions: 40.0%, $0.024. block/review: 32.6%, not published. Klaussy: 29.8%, not published. Copilot code review: 26.0%, usage credits. DeepSeek Harness Reviewer: 25.6%, not published. Devin AI: 23.8%, ~$2. Qodo: 22.1%, ~$1.70. Codex: 18.5%, ~$1.25. Cubic: 16.3%, ~$2. Greptile: 16.2%, ~$1. Cursor: 9.6%, ~$1.50. Perch · Jev: 7.9%, $0.011.</desc>
