<svg xmlns="http://www.w3.org/2000/svg" width="880" height="488" viewBox="0 0 880 488" role="img" aria-labelledby="title desc">
<title id="title">Perch on the Greptile benchmark</title>
<desc id="desc">Known bugs caught on the Greptile benchmark, and what a pull request costs. Greptile: 82%, ~$1. Perch · OpenAI Decisions: 76%, $0.007. Cursor Bugbot: 58%, ~$1.50. GitHub Copilot: 54%, usage credits. CodeRabbit: 44%, $1–3. Perch · Jev: 44%, $0.003. Graphite: 6%, ~$2.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.n{font-variant-numeric:tabular-nums}</style>
<text x="16" y="34" font-size="22" font-weight="700" fill="#1f2328">Greptile benchmark</text>
<text x="16" y="60" font-size="14" fill="#59636e">Known bugs caught in 50 pull requests from Sentry, Cal.com, Grafana, Keycloak and Discourse, and the cost of one.</text>
<line x1="16" y1="82" x2="864" y2="82" stroke="#d1d9e0" stroke-width="1"/>
<text x="222" y="108" font-size="12" font-weight="600" fill="#818b98">Known bugs caught</text>
<text x="864" y="108" font-size="12" font-weight="600" text-anchor="end" fill="#818b98">Cost of a pull request</text>
<text x="16" y="148" font-size="15" fill="#59636e">Greptile</text>
<path d="M222,134h455a5,5 0 0 1 5,5v8a5,5 0 0 1 -5,5h-455z" fill="#f1f2f4"/>
<path d="M222,134h372.2a5,5 0 0 1 5,5v8a5,5 0 0 1 -5,5h-372.2z" fill="#b9b8b0"/>
<text class="n" x="609.2" y="148" font-size="15" font-weight="600" fill="#59636e">82%</text>
<text class="n" x="864" y="148" font-size="15" text-anchor="end" font-weight="400" fill="#59636e">~$1</text>
<rect x="4" y="164" width="872" height="34" rx="8" fill="#c27a12" fill-opacity="0.1"/>
<text x="16" y="186" font-size="15" font-weight="700" fill="#1f2328">Perch · OpenAI Decisions</text>
<path d="M222,172h455a5,5 0 0 1 5,5v8a5,5 0 0 1 -5,5h-455z" fill="#f1f2f4"/>
<path d="M222,172h344.6a5,5 0 0 1 5,5v8a5,5 0 0 1 -5,5h-344.6z" fill="#c27a12"/>
<text class="n" x="581.6" y="186" font-size="15" font-weight="700" fill="#1f2328">76%</text>
<text class="n" x="864" y="186" font-size="15" text-anchor="end" font-weight="700" fill="#c27a12">$0.007</text>
<text x="16" y="224" font-size="15" fill="#59636e">Cursor Bugbot</text>
<path d="M222,210h455a5,5 0 0 1 5,5v8a5,5 0 0 1 -5,5h-455z" fill="#f1f2f4"/>
<path d="M222,210h261.8a5,5 0 0 1 5,5v8a5,5 0 0 1 -5,5h-261.8z" fill="#b9b8b0"/>
<text class="n" x="498.8" y="224" font-size="15" font-weight="600" fill="#59636e">58%</text>
<text class="n" x="864" y="224" font-size="15" text-anchor="end" font-weight="400" fill="#59636e">~$1.50</text>
<text x="16" y="262" font-size="15" fill="#59636e">GitHub Copilot</text>
<path d="M222,248h455a5,5 0 0 1 5,5v8a5,5 0 0 1 -5,5h-455z" fill="#f1f2f4"/>
<path d="M222,248h243.4a5,5 0 0 1 5,5v8a5,5 0 0 1 -5,5h-243.4z" fill="#b9b8b0"/>
<text class="n" x="480.4" y="262" font-size="15" font-weight="600" fill="#59636e">54%</text>
<text class="n" x="864" y="262" font-size="15" text-anchor="end" font-weight="400" fill="#59636e">usage credits</text>
<text x="16" y="300" font-size="15" fill="#59636e">CodeRabbit</text>
<path d="M222,286h455a5,5 0 0 1 5,5v8a5,5 0 0 1 -5,5h-455z" fill="#f1f2f4"/>
<path d="M222,286h197.4a5,5 0 0 1 5,5v8a5,5 0 0 1 -5,5h-197.4z" fill="#b9b8b0"/>
<text class="n" x="434.4" y="300" font-size="15" font-weight="600" fill="#59636e">44%</text>
<text class="n" x="864" y="300" font-size="15" text-anchor="end" font-weight="400" fill="#59636e">$1–3</text>
<rect x="4" y="316" width="872" height="34" rx="8" fill="#c27a12" fill-opacity="0.1"/>
<text x="16" y="338" font-size="15" font-weight="700" fill="#1f2328">Perch · Jev</text>
<path d="M222,324h455a5,5 0 0 1 5,5v8a5,5 0 0 1 -5,5h-455z" fill="#f1f2f4"/>
<path d="M222,324h197.4a5,5 0 0 1 5,5v8a5,5 0 0 1 -5,5h-197.4z" fill="#c27a12"/>
<text class="n" x="434.4" y="338" font-size="15" font-weight="700" fill="#1f2328">44%</text>
<text class="n" x="864" y="338" font-size="15" text-anchor="end" font-weight="700" fill="#c27a12">$0.003</text>
<text x="16" y="376" font-size="15" fill="#59636e">Graphite</text>
<path d="M222,362h455a5,5 0 0 1 5,5v8a5,5 0 0 1 -5,5h-455z" fill="#f1f2f4"/>
<path d="M222,362h22.6a5,5 0 0 1 5,5v8a5,5 0 0 1 -5,5h-22.6z" fill="#b9b8b0"/>
<text class="n" x="259.6" y="376" font-size="15" font-weight="600" fill="#59636e">6%</text>
<text class="n" x="864" y="376" font-size="15" text-anchor="end" font-weight="400" fill="#59636e">~$2</text>
<text x="16" y="416" font-size="11.5" fill="#818b98">Perch at a 60% floor, credited for flagging the function that holds the bug.</text>
<text x="16" y="433" font-size="11.5" fill="#818b98">Perch's cost is the model's, measured on each run: $0.34 on OpenAI Decisions and $0.15 on Jev for all 50.</text>
<text x="16" y="450" font-size="11.5" fill="#818b98">Others: catch rates from greptile.com/benchmarks, October 22, 2026, credited for a line comment that identifies the bug.</text>
<text x="16" y="467" font-size="11.5" fill="#818b98">Their costs are list prices, with seat plans divided over 20 pull requests a developer a month.</text>
</svg>
