<title id="title">Perch on ReviewBench</title>
<desc id="desc">F1, precision and recall for perch beside the ReviewBench leaderboard. Laude RevEngine Prime: F1 59.6%, precision 83.6%, recall 46.3%. block/review: F1 47.7%, precision 88.7%, recall 32.6%. Klaussy: F1 44.1%, precision 84.1%, recall 29.8%. Copilot code review: F1 40.1%, precision 87.8%, recall 26%. DeepSeek Harness Reviewer: F1 39.9%, precision 89.5%, recall 25.6%. Devin AI: F1 37%, precision 84%, recall 23.8%. Qodo: F1 35.1%, precision 85.3%, recall 22.1%. Perch with GPT-6 Luna: F1 34.2%, precision 21.7%, recall 81.1%. Codex: F1 30.4%, precision 86%, recall 18.5%. Cubic: F1 27.3%, precision 85.5%, recall 16.3%. Greptile: F1 27.2%, precision 86.1%, recall 16.2%. Perch with Jev 1.14: F1 25.5%, precision 34.7%, recall 20.2%. Cursor: F1 17.3%, precision 87.7%, recall 9.6%.</desc>
