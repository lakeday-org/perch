# Every push to main and every pull request, including one from a fork.
#
# Two jobs, because they fail for different reasons and you want to see which. `check` is the build: lint, types, tests, the
# bundle, the package. It needs no secret, so a fork's pull request runs exactly what the branch does. `scan` is perch reading
# the code it just built, which needs a key a fork will not have, and runs on pull requests only.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: The bundle builds and loads
        run: npm run build

      - name: Nothing in the package that should not ship
        run: npm pack --dry-run

  scan:
    name: perch scan
    needs: check
    runs-on: ubuntu-latest
    # Pull requests and nothing else. A merge to main is code that was scanned as the pull request it arrived in, and scanning it
    # again says the same thing for the same money. A fork's pull request is given no secrets, so it cannot run this either and
    # the whole job is skipped rather than failing over a key it was never going to have.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    env:
      PERCH_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # --since needs the base branch to compare against, which a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Everything this pull request touched. The scan comes back 3 on what is wrong and 0 on what is only worth reading, so
      # there is nothing to filter here: which questions those are is in scan.yaml and perch.yaml, next to the questions.
      - name: perch scan
        run: node bin/perch.mjs scan ${{ github.event_name == 'pull_request' && format('--since origin/{0}', github.base_ref) || '' }}

  # The docs live here and the site that serves them lives in perch-cloud, which builds them from this branch. Nothing told it
  # when they changed, so a page added here stayed invisible until somebody deployed by hand: docs/skill.md sat on main for a
  # release and a half while docs.perchscan.com answered 404 for it. Fired on every push rather than on a path filter, because
  # the site builds the whole of main and a rebuild costs nothing.
  docs:
    name: publish docs
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # A repository_dispatch to another repository needs a token that reaches it; the job's own GITHUB_TOKEN does not.
      - name: tell perch-cloud to rebuild
        env:
          GH_TOKEN: ${{ secrets.PERCH_CLOUD_DISPATCH }}
        run: gh api repos/lakeday-org/perch-cloud/dispatches -f event_type=docs
