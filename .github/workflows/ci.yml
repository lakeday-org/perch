# Every push to main and every pull request, including one from a fork.
#
# The build needs no secret, so a fork's pull request runs exactly what the branch does.
# The Perch workflow scans pull requests and main separately.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - run: npm ci

      # perch coverage runs a repository's tests itself; its tests run pytest for real against small fixtures.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install pytest pytest-cov

      # And go test, cargo, dotnet test, Gradle, Maven and sbt, against small projects of their own; the runner image has Go,
      # Rust, Gradle and Maven.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The repository allows only GitHub's own actions, so sbt's launcher comes from its GitHub release, checked against the
      # release's checksum. sbt's apt repository stopped answering GitHub's runners on October 21, 2026. The launcher fetches the
      # sbt each test project names.
      - name: Install sbt
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sbt.tgz" https://github.com/sbt/sbt/releases/download/v1.13.0/sbt-1.13.0.tgz
          echo "06806805ffd26232727326216766ed4793b549f8c1e6ffeef2e610db7245b698  $RUNNER_TEMP/sbt.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sbt.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/sbt/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: The bundle builds and loads
        run: npm run build

      - name: Nothing in the package that should not ship
        run: npm pack --dry-run

  # The parser is a native addon with a separate build for each platform, and a Windows build that cannot load stops perch
  # before it reads anything. 0.4.9 shipped one that imported node.dll, which Node.js does not have.
  windows:
    name: windows (node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm

      - run: npm ci

      - name: The bundle builds and loads the parser
        run: |
          npm run build
          node bin/perch.mjs --version

      - name: Parse, build the call graph, and scan
        run: npx vitest run test/pack.test.ts test/treesitter.test.ts test/parser-callables.test.ts test/analyze.test.js test/scan.test.js

  # The docs live here and the site that serves them lives in perch-cloud, which builds them from this branch. Nothing told it
  # when they changed, so a page added here stayed invisible until somebody deployed by hand: docs/skill.md sat on main for a
  # release and a half while docs.perchscan.com answered 404 for it. Fired on every push rather than on a path filter, because
  # the site builds the whole of main and a rebuild costs nothing.
  docs:
    name: publish docs
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # A repository_dispatch to another repository needs a token that reaches it; the job's own GITHUB_TOKEN does not.
      - name: tell perch-cloud to rebuild
        env:
          GH_TOKEN: ${{ secrets.PERCH_CLOUD_DISPATCH }}
        run: gh api repos/lakeday-org/perch-cloud/dispatches -f event_type=docs
