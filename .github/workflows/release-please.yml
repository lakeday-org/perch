# What version to cut, decided by what the commits say rather than by whoever is at the keyboard. A `fix:` is a patch, a `feat:`
# is a minor, a `feat!:` or a BREAKING CHANGE footer is a major, and anything else does not move the number.
#
# It keeps one pull request open with the bump and the changelog in it, amending as more lands on main. Merging that is the
# release: the tag and the GitHub release are made here, and so is the publish.
#
# The publish lives in this file and not in publish.yml because a tag written with the job's own GITHUB_TOKEN does not start
# another workflow. GitHub refuses that to stop a workflow triggering itself, so a `on: push: tags` job would sit there and
# never run. publish.yml stays for a tag pushed by hand.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # npm checks this against the trusted publisher configured for the package. Same as publish.yml: no token anywhere.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later, and Node 22 ships an older one.
      - run: npm install -g npm@latest
        if: ${{ steps.release.outputs.release_created }}

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run check
        if: ${{ steps.release.outputs.release_created }}

      - run: npm publish
        if: ${{ steps.release.outputs.release_created }}
