# Added by Perch Cloud. perch signs in with this job's GitHub OIDC token, so no secret is needed.
name: perch

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

jobs:
  perch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Scan the pull request
        if: github.event_name == 'pull_request'
        run: |
          set +e
          npm exec --yes --package='github:lakeday-org/perch#main' -- perch scan --filter type=defect,lint,security
          status=$?
          # While findings from the new model are audited, they are reported in the Perch issues check rather than failing the
          # job. Exit 3 means perch found something; 1 and 2 mean it could not run, and still fail.
          if [ "$status" -eq 3 ]; then exit 0; fi
          exit "$status"
      - name: Scan the default branch
        if: github.event_name == 'push'
        run: |
          set +e
          npm exec --yes --package='github:lakeday-org/perch#main' -- perch scan --filter type=defect,lint,security
          status=$?
          if [ "$status" -eq 3 ]; then exit 0; fi
          exit "$status"
