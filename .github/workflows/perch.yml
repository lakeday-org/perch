# Added by Perch Cloud. perch signs in with this job's GitHub OIDC token, so no secret is needed.
name: perch

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  perch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan what this pull request changed
        if: github.event_name == 'pull_request'
        run: npx --yes @lakeday/perch scan --since origin/${{ github.base_ref }}
      - name: Scan the repository
        if: github.event_name == 'push'
        run: npx --yes @lakeday/perch scan
