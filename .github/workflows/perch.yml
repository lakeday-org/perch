# Added by Perch Cloud. Staging test only; do not merge this workflow.
name: perch staging

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  perch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PERCH_CLOUD_URL: https://dash-staging.perchscan.com
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm exec --yes --package='github:lakeday-org/perch#codex/staging-prototype-cli' -- perch scan --since origin/${{ github.base_ref }}
