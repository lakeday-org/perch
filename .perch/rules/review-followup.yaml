- name: authentication-failure-stops-unit-work
  where: src/units.js
  ensure: >-
    In the per-unit catches of askUnits and searchUnits, authentication or
    authorization failures escape to the run's caller. Turning them into
    failed checks and continuing through the remaining units breaks this rule.
    Source preparation errors and ordinary per-unit failures can stay local.
- name: search-witness-does-not-erase-failures
  where: mentions unresolved.push
  ensure: >-
    Read the two results.push calls that end each plan in searchUnits. When
    unresolved has entries and settled names a witness, the result pushed
    carries incomplete with those messages. Dropping the messages once a witness
    is found breaks this rule.
