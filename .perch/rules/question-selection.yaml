# Which of perch's own questions a method is asked. A scan and a check have to agree, and a filter has to ask what it names.
# A misspelt language selector and the labels in perch issues <id> are covered by tests instead: as rules they read in the
# fifties on the broken code, which cannot tell it from the fixed code.
- name: filter-asks-what-it-names
  where: src/scan.js
  ensure: >-
    Read typesAsked. For a --filter clause whose key is kind or rule, it finds
    the questions that raise it and adds their issue type to the set it returns.
    Adding types only for type= clauses breaks this rule.
- name: check-asks-what-a-scan-asks
  where: src/check.js
  ensure: >-
    Read where checkTarget chooses perch's own questions for a method. It asks
    the issue types a scan would ask, from scan_types or the defaults, or the
    types --rules names. Asking every question perch ships, security included,
    when neither says so breaks this rule.
