# A reading takes as many requests as it needs; test/review-regressions.test.js checks that a large one is sent whole. What
# still has to end is the retry loop for code the endpoint keeps rejecting as too large.
- name: token-retries-are-bounded
  where: src/tokens.js
  ensure: >-
    Read withTokenRetries. It stops with an incomplete-check error once the
    token budget cannot shrink any further or after a fixed number of attempts.
    Retrying a request the endpoint keeps rejecting forever breaks this rule.
