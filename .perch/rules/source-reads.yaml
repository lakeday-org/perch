- name: whole-file-source-is-read-only-for-rules-that-need-it
  where: src/scan.js
  ensure: >-
    Read checking in scanRepository. It lists the tree and reads each file's
    source only inside the if that tests whether some rule is a search or is not
    a method rule. Reading them outside that test, on a scan whose rules are all
    method rules, breaks this rule.
