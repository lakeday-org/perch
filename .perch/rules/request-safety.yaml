- name: size-retries-stop-with-an-error
  where: src/tokens.js
  ensure: >-
    Read withTokenRetries's handling of repeated context-size errors. Its
    loop has a finite stopping condition and throws an incomplete-check error
    when it stops. Depending on the read callback to end otherwise unbounded
    retries breaks this rule. Returning a value from the exhaustion branch
    also breaks it: failure to complete a reading must reach the caller.
- name: size-retries-reduce-the-budget
  where: src/tokens.js
  ensure: >-
    Read the budget update after withTokenRetries catches a context-size
    error. The next attempt receives a smaller token budget than the failed
    attempt. Calculating a smaller value but resetting budget to initial,
    or leaving budget unchanged, breaks this rule.
- name: split-requests-preserve-results
  where: src/systemone.js
  ensure: >-
    Read the last return in askAll. With more than one response, answers is
    every response's answers merged into one object. Returning only the last
    response's answers breaks this rule.
- name: split-requests-account-for-all-usage
  where: src/systemone.js
  ensure: >-
    Read the usage function in askAll and the last return. With more than one
    response, the usage returned is the sum over all of them. Returning only the
    last response's usage breaks this rule.
- name: failed-batches-do-not-return-partial-success
  where: src/systemone.js
  ensure: >-
    Read the try/catch around the questionBatches loop in askAll. When a batch
    fails, the catch puts usage and requests on the error and throws it.
    Returning the answers earlier batches gathered breaks this rule.
- name: source-retries-rebuild-the-request
  where: callers of withTokenRetries
  ensure: >-
    Read the callback this method passes to withTokenRetries. On the first
    budget it may send the steps it was given. On a budget below the first one,
    what it sends is rebuilt for that budget: it calls prepare(budget), or
    chunks the source again to fit, and throws when it can do neither. Sending
    the steps it was first given on a smaller budget breaks this rule.
- name: incomplete-scans-keep-their-status
  where: src/scan.js
  ensure: >-
    scanRepository sets run.status to incomplete when run.incomplete has entries
    and to complete otherwise. Setting it to complete without looking at
    run.incomplete breaks this rule.
- name: incomplete-scans-retain-the-reasons
  where: src/scan.js
  ensure: >-
    Read the assignment to run.incomplete in scanRepository. The list holds the
    error of every run.failed entry marked incomplete, and the incomplete
    message of every file and search result that has one. Assigning an empty
    list, or leaving either source out, breaks this rule.
- name: incomplete-checks-do-not-decide-the-exit-code
  where: src/cli.js
  ensure: >-
    Read where the scan command chooses exit. run.incomplete is printed with
    io.note and plays no part in the choice: exit is EXIT.broke only when
    unanswered has entries, EXIT.found when a gating issue came back, and
    EXIT.clean otherwise. Choosing EXIT.broke because run.incomplete has entries
    breaks this rule.
