# What a scan reads, and what it says when it read nothing. `ignore` is for a scan of the repository, not for a path you named.
- name: named-target-overrides-ignore
  where: src/scan.js
  ensure: >-
    Read coversNamed and ignored in scanRepository. An ignore glob that covers a
    path in named is filtered out of ignored, so inScope never applies it.
    Applying every ignore glob, whether or not it covers a named path, breaks
    this rule.
- name: a-scan-that-read-nothing-fails
  where: src/scan.js
  ensure: >-
    Read answered and failures in scanRepository, after the reading and the
    checking finish. When answered is 0 and failures has entries, it throws
    nothing could be read. Throwing only on a count of failures in a row, so a
    run of a few methods ends with none answered and no error, breaks this rule.
- name: empty-scope-is-said
  where: src/cli.js
  ensure: >-
    Read the end of the scan command. It checks whether the run read no method
    and asked no rule, and in that case prints that nothing was read and why,
    such as ignore covering the scope. Printing the usual tally, which says
    "nothing to report", for a run that read nothing breaks this rule.
