# What a scan reads, and what it says when it read nothing. `ignore` is for a scan of the repository, not for a path you named.
- name: named-target-overrides-ignore
  where: src/scan.js
  ensure: >-
    Read where scanRepository builds inScope. An ignore glob that covers a path
    the run was explicitly given, its target or a --paths entry, is not applied
    to that run, while other ignore globs still are. Dropping a named target
    because ignore covers it breaks this rule.
- name: a-scan-that-read-nothing-fails
  where: src/scan.js
  ensure: >-
    Read what scanRepository does once its methods and rules have been asked.
    If none of them was answered and at least one failed for a reason other than
    being too big to check, it throws, however few methods were tried. Relying
    only on a count of failures in a row, so a run of a few methods can end
    with none answered and no error, breaks this rule.
- name: empty-scope-is-said
  where: src/cli.js
  ensure: >-
    Read the end of the scan command. It checks whether the run read no method
    and asked no rule, and in that case prints that nothing was read and why,
    such as ignore covering the scope. Printing the usual tally, which says
    "nothing to report", for a run that read nothing breaks this rule.
