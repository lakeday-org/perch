# What perch keeps in .perch between runs. Answers are not kept: the endpoint caches those, so every run asks. The parse of a
# commit is kept, because it is local work that a model never sees and perch issues needs it on every call.
- name: scan-asks-every-method
  where: src/scan.js
  ensure: >-
    Read ask inside scanRepository. Unless stepFor marked the method skip, it
    calls questionMethod, which sends the method to the model. Returning an
    answer an earlier run saved instead of calling questionMethod breaks this
    rule.
- name: rules-asked-every-run
  where: src/units.js
  ensure: >-
    Read askOne inside askUnits and askOne inside searchUnits. Each calls
    askUnitSteps for the unit it is given. Returning a check an earlier run
    saved instead of calling askUnitSteps breaks this rule.
- name: parse-reused-per-commit
  where: src/analyze.js
  ensure: >-
    analyzeTree returns the saved scan.json when a complete one exists for
    the same scan id, before listing the tree or parsing any file. Parsing
    again when a complete analysis for that id is on disk breaks this rule.
- name: no-answer-history
  where: src/store.js
  ensure: >-
    Read prune. It removes every folder of the kind it is given except the one
    named by the id it is given. Leaving earlier run folders in place breaks
    this rule.
