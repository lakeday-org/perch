- name: node-wrapper-reads-each-native-value-once
  where: src/treesitter/node.ts
  ensure: >-
    Read the type, startIndex, endIndex, startPosition, endPosition and
    childCount getters of Node. Each keeps what the native call returned in a
    private field and returns the kept value on later reads. One of these six
    calling the native method on every read breaks this rule.
