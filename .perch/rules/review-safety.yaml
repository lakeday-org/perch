- name: size-errors-require-context-evidence
  where: src/systemone.js
  ensure: >-
    Read sizeError in request. It is true for HTTP 413, or for a 400 or 422
    whose detail names the size of the request or its context length and does
    not match accessError. A detail about an invalid token, a quota or a rate
    limit matches accessError and is never a size error. Treating any detail
    that mentions token and limit as a size error breaks this rule.
- name: file-unit-failures-stay-local
  where: src/units.js
  ensure: >-
    In askUnits, a source-specific failure while preparing or asking one file
    is recorded for that unit and leaves other units able to complete. The
    protection covers preparing source chunks and locating a broken rule.
    Letting one such error reject the entire batch breaks this rule.
    Authentication and authorization errors must still stop the run.
- name: search-uncertainty-does-not-hide-witnesses
  where: src/units.js
  ensure: >-
    Read searchUnits's askOne and the Promise.all that calls it. If askOne
    throws because a chunked unit lacks evidence, that exception is caught
    locally so later units can still supply a witness. Letting it escape
    searchUnits breaks this rule. No witness plus inconclusive units must
    produce an incomplete result.
- name: prepared-source-is-reused
  where: '{src/scan.js,src/units.js}'
  ensure: >-
    Read the line that chooses active in questionMethod or askUnitSteps,
    whichever this file holds. When steps were passed in and budget equals the
    first budget, active is those steps. Calling prepare(budget) on that first
    attempt, when steps were passed in, breaks this rule.
