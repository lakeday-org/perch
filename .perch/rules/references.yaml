- name: reference-names-allow-any-script
  where: src/treesitter/references.ts
  ensure: >-
    Read IDENTIFIER and validReference. A name with letters outside ASCII,
    such as café, matches IDENTIFIER and is returned as it is. An ASCII-only
    pattern such as [A-Za-z_], which turns that name into <dynamic>, breaks
    this rule.
# Bounded to the methods that read these imports: read over the whole of references.ts, both rules sat in the fifties once
# the file passed a thousand lines, whatever the code did.
- name: import-equals-is-an-import
  where: mentions import_require_clause
  except: "test/**"
  each: method
  ensure: >-
    If this method reads the module or the local binding of an import, then
    for TypeScript's import Foo = require("./foo") the module it reads is the
    import_require_clause's source, "./foo", and the binding is Foo. A method
    that reads imports and leaves import_require_clause out of either breaks
    this rule. A method that only lists node types holds it.
- name: import-call-is-an-import
  where: mentions <unknown-module>
  except: "test/**"
  each: method
  ensure: >-
    Find the branch of this method for a call node whose callee is the import
    keyword. It records the call with makeReference("import", ...), naming
    the call's argument as the module. Recording it as a call to a function
    named import breaks this rule.
