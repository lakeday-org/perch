# Questions shipped with Perch. Repository rules in perch.yaml may override a name or add questions.
# language is optional: a name or a list of parser language IDs. Omit it to ask in every language.
# Each method is asked only the questions enabled for its parsed language.
# The CWE checks are the 2025 MITRE Top 25, plus six classes it leaves out that one method can still show: weak crypto,
# disabled certificate checks, hard-coded credentials, integer overflow, uninitialized reads and open redirects.
# Memory-safety checks are limited to languages with reachable native memory operations; the broad security check still
# covers every language. Each specific check files under a readable label, such as sql_injection for cwe_89.

- name: has_bug
  each: method
  where: "**/*"
  ask: Does `method` contain a concrete behavioral defect that a caller can reach?
  "true": >
    For some input a caller can pass, the method returns a wrong result, leaves wrong state, throws
    when it should not, or fails to throw when it should
  "false": >
    The method behaves correctly for every input its callers can pass; style, performance, and
    hypothetical misuse do not count
  issue:
    type: defect
    label: kind
    pick: strongest
  min: 60
- name: kind
  type: choice
  each: method
  where: "**/*"
  ask: If `method` has a defect, which kind is it?
  options:
    boundary: An off-by-one, a wrong comparison, or a mishandled edge of a range
    missing_null_handling: A null, undefined, empty, or absent value is not handled
    wrong_return: The wrong value, or a value of the wrong shape, is returned for some input
    swallowed_error: An error is caught, ignored, or turned into a misleading result
    state_mutation: Shared or input state is mutated when it should not be, or left stale when it should change
    ordering: Operations run in the wrong order, or rely on an order that is not guaranteed
    resource_leak: A handle, lock, timer, process, or connection is not released on some path
    inverted_condition: A condition, sign, or boolean is the wrong way round
- name: severity
  type: score
  each: method
  where: "**/*"
  ask: If something is wrong with `method`, how much would a caller feel it?
  levels:
    - No caller would notice
    - A wrong result in a rare case, or one the caller can see and recover from
    - A wrong result or wrong state in ordinary use
    - Data lost, corrupted, or exposed, or a check that should stop someone bypassed
- name: refactor
  type: choice
  each: method
  where: "**/*"
  ask: >
    Judging from `method`, its `metrics` (risk_score and maintainability_index run 0-100,
    cyclomatic_complexity and max_nesting are counts), and how its callers use it, what does it most
    need?
  options:
    split: Does too many things; split it into smaller methods with one job each
    flatten: Nested too deeply; flatten with early returns or extracted helpers
    simplify_conditions: Conditions are hard to follow; simplify or name them
    deduplicate: Repeats logic that exists elsewhere in the shown code; reuse it
    rename: The name or parameters misdescribe what it does; rename them
    remove_dead_code: Contains unreachable or unused code; remove it
    none: No refactor needed
  issue:
    type: refactor
    label: refactor
    except: none
  min: 60
- name: does_what_it_claims
  each: method
  where: "**/*"
  ask: Does `method` do what its name, its parameters and its `leading_comment` say it does?
  "true": It behaves the way its name and its comment say it does
  "false": It does something different from, less than, or more than its name and comment say, so one
    of the two is wrong
  issue:
    type: defect
    label: does_not_do_what_it_claims
    on: false
    pick: strongest
  min: 70
- name: documented
  each: method
  where: "**/*"
  ask: Could a caller learn what `method` promises from its `leading_comment`, or from the code itself
    where it is small enough to read?
  "true": Its contract, its edge cases and its side effects are all there to be read
  "false": "A caller could not learn what it promises without reading it through. A comment that says
    something untrue is misaligned rather than this: this is what is missing."
  issue:
    type: docs
    label: docs
    on: false
  min: 75
- name: security_any
  each: method
  where: "**/*"
  ask: "Can an attacker exploit `method`?"
  "true": "An attacker can use it to do something they should not be able to."
  "false": "An attacker cannot exploit it."
  issue:
    type: security
    label: vulnerability
    pick: strongest
  min: 70
