# Questions shipped with Perch. Repository rules in perch.yaml may override a name or add questions.
# language is optional: a name or a list of parser language IDs. Omit it to ask in every language.
# Each method is asked only the questions enabled for its parsed language.
# The CWE checks are the 2025 MITRE Top 25, less CWE-20, whose every case is a more specific CWE here and which otherwise
# fires on any unchecked parameter. Six classes it leaves out are added, since one method can still show them: weak crypto,
# disabled certificate checks, hard-coded credentials, integer overflow, uninitialized reads and open redirects.
# Memory-safety checks are limited to languages with reachable native memory operations.
# Each specific check files under a readable label, such as sql_injection for cwe_89.

- name: has_bug
  each: method
  where: "**/*"
  ask: Does `method` contain a concrete behavioral defect that a caller can reach?
  "true": >
    For some input a caller can pass, the method returns a wrong result, leaves wrong state, throws
    when it should not, or fails to throw when it should
  "false": >
    The method behaves correctly for every input its callers can pass; style, performance, and
    hypothetical misuse do not count. A helper is judged by what its shown callers pass it
  issue:
    type: defect
    label: kind
    pick: strongest
  min: 60
- name: bug_edge_case
  each: method
  where: "**/*"
  ask: Does `method` produce a wrong result for a valid empty, zero, first, last, or missing input?
  "true": One of these inputs produces an incorrect result or failure, and a shown caller can pass it or it arrives from outside the program.
  "false": These inputs produce the intended results and errors, or no shown caller can pass them.
  issue:
    type: defect
    label: kind
    pick: strongest
  min: 60
- name: kind
  type: choice
  each: method
  where: "**/*"
  ask: If `method` has a defect, which kind is it?
  options:
    boundary: An off-by-one, a wrong comparison, or a mishandled edge of a range
    missing_null_handling: A null, undefined, empty, or absent value that a caller can pass is not handled
    wrong_return: The wrong value, or a value of the wrong shape, is returned for some input
    swallowed_error: An error is caught, ignored, or turned into a misleading result
    state_mutation: Shared or input state is mutated when it should not be, or left stale when it should change
    ordering: Operations run in an order that gives a wrong result or state for a concrete sequence of calls or events
    resource_leak: A handle, lock, timer, process, or connection is not released on some path
    wrong_lookup: A lookup or match finds the wrong entry, such as an inherited key, the wrong scope, or a partial match
    inverted_condition: A condition, sign, or boolean is the wrong way round
- name: severity
  type: score
  each: method
  where: "**/*"
  ask: If something is wrong with `method`, how much would a caller feel it?
  levels:
    - No caller would notice
    - A wrong result in a rare case, or one the caller can see and recover from
    - A wrong result or wrong state in ordinary use
    - Data lost, corrupted, or exposed, or a check that should stop someone bypassed
- name: refactor
  type: choice
  each: method
  where: "**/*"
  ask: >
    Judging from `method`, its `metrics` (risk_score and maintainability_index run 0-100,
    cyclomatic_complexity and max_nesting are counts), and how its callers use it, what does it most
    need?
  options:
    split: Does too many things; split it into smaller methods with one job each
    flatten: Nested too deeply; flatten with early returns or extracted helpers
    simplify_conditions: Conditions are hard to follow; simplify or name them
    deduplicate: Repeats logic that exists elsewhere in the shown code; reuse it
    rename: The name or parameters misdescribe what it does; rename them
    remove_dead_code: Contains unreachable or unused code; remove it
    none: No refactor needed
  issue:
    type: refactor
    label: refactor
    except: none
  min: 60
- name: documented
  each: method
  where: "**/*"
  ask: Could a caller learn what `method` promises from its `leading_comment`, or from the code itself
    where it is small enough to read?
  "true": Its contract, its edge cases and its side effects are all there to be read
  "false": "A caller could not learn what it promises without reading it through. A comment that says
    something untrue is misaligned rather than this: this is what is missing."
  issue:
    type: docs
    label: docs
    on: false
  min: 75
- name: cwe_79
  each: method
  where: "**/*"
  ask: "Is `method` vulnerable to cross-site scripting?"
  "true": "Outside text reaches HTML or script output without escaping. `method` or its callers show that input comes from someone less trusted than whoever runs the program: a network request, a message, or a file or upload from another party. The operator's own arguments, environment and configuration are trusted."
  "false": "Its output is escaped, or no attacker-controlled text reaches it."
  issue:
    type: security
    label: xss
    pick: strongest
  min: 60
- name: cwe_89
  each: method
  where: "**/*"
  ask: "Is `method` vulnerable to SQL injection?"
  "true": "Outside text becomes part of the SQL it runs. `method` or its callers show that input comes from someone less trusted than whoever runs the program: a network request, a message, or a file or upload from another party. The operator's own arguments, environment and configuration are trusted."
  "false": "Its SQL is fixed, or outside values are bound as parameters."
  issue:
    type: security
    label: sql_injection
    pick: strongest
  min: 60
- name: cwe_352
  each: method
  where: "**/*"
  ask: "Is `method` vulnerable to cross-site request forgery?"
  "true": "A browser request that changes state is accepted without a CSRF token or origin check."
  "false": "It checks for forgery, or changes nothing a browser request can trigger."
  issue:
    type: security
    label: csrf
    pick: strongest
  min: 70
- name: cwe_862
  each: method
  where: "**/*"
  ask: "Does `method` skip an authorization check it needs?"
  "true": "Its name, documentation or callers show its action must be limited to certain users, and it performs it without checking who is calling."
  "false": "It checks permission, or its action needs none."
  issue:
    type: security
    label: missing_authorization
    pick: strongest
  min: 70
- name: cwe_787
  each: method
  where: "**/*"
  language:
    - c
    - cpp
    - rust
    - zig
  ask: "Can `method` write past the end of a buffer?"
  "true": "An index, pointer or length lets it write outside the memory it owns."
  "false": "Every write stays inside its buffer."
  issue:
    type: security
    label: out_of_bounds_write
    pick: strongest
  min: 70
- name: cwe_22
  each: method
  where: "**/*"
  ask: "Is `method` vulnerable to path traversal?"
  "true": "A path built from outside input can reach files beyond the directory it should be limited to. `method` or its callers show that input comes from someone less trusted than whoever runs the program: a network request, a message, or a file or upload from another party. The operator's own arguments, environment and configuration are trusted."
  "false": "Its paths are fixed, confined to their directory, or chosen by the operator for their own files."
  issue:
    type: security
    label: path_traversal
    pick: strongest
  min: 70
- name: cwe_416
  each: method
  where: "**/*"
  language:
    - c
    - cpp
    - rust
    - zig
  ask: "Can `method` use memory after it is freed?"
  "true": "It reads or writes through a pointer or reference after the memory is released."
  "false": "It never uses memory after release."
  issue:
    type: security
    label: use_after_free
    pick: strongest
  min: 70
- name: cwe_125
  each: method
  where: "**/*"
  language:
    - c
