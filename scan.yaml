- name: cwe_918
  each: method
  where: "**/*"
  ask: "Is `method` vulnerable to server-side request forgery?"
  "true": "A destination from untrusted input decides where a server sends a request. `method` or its callers show that input comes from someone less trusted than whoever runs the program: a network request, a message, or a file or upload from another party. The operator's own arguments, environment and configuration are trusted."
  "false": "Its destinations are fixed, checked against an allow list, or set by the operator's own configuration."
  issue:
    type: security
    label: ssrf
    pick: strongest
  min: 70
- name: cwe_77
  each: method
  where: "**/*"
  ask: "Is `method` vulnerable to command injection?"
  "true": "Outside text changes a command passed to an interpreter. `method` or its callers show that input comes from someone less trusted than whoever runs the program: a network request, a message, or a file or upload from another party. The operator's own arguments, environment and configuration are trusted."
  "false": "Its commands are fixed, or outside input is passed as data."
  issue:
