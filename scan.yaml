  min: 70
- name: cwe_434
  each: method
  where: "**/*"
  ask: "Does `method` accept a dangerous file upload?"
  "true": "An uploaded file of any type can be stored where it can be run or served. `method` or its callers show that input comes from someone less trusted than whoever runs the program: a network request, a message, or a file or upload from another party. The operator's own arguments, environment and configuration are trusted."
  "false": "Uploads are checked, or stored where they cannot do harm."
  issue:
    type: security
    label: unsafe_file_upload
    pick: strongest
  min: 70
- name: cwe_476
  each: method
  where: "**/*"
  language:
    - c
    - cpp
