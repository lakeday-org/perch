    pick: strongest
  min: 60
- name: cwe_78
  each: method
  where: "**/*"
  ask: "Is `method` vulnerable to OS command injection?"
  "true": "Outside text becomes part of a shell command. `method` or its callers show that input comes from someone less trusted than whoever runs the program: a network request, a message, or a file or upload from another party. The operator's own arguments, environment and configuration are trusted."
  "false": "Its commands are fixed, or pass arguments without a shell."
  issue:
    type: security
