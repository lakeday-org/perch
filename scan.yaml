  "true": "It runs where records belonging to different users are kept, such as a request handler or a database query, and looks one up by an ID from another party's request without checking the record belongs to that caller. `method` or its callers show that input comes from someone less trusted than whoever runs the program: a network request, a message, or a file or upload from another party. The operator's own arguments, environment and configuration are trusted."
  "false": "It checks ownership, its records belong to one user, or it only passes an ID to a service that makes the ownership decision."
  issue:
