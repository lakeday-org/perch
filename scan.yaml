- name: cwe_120
  each: method
  where: "**/*"
  language:
    - c
    - cpp
    - rust
    - zig
  ask: "Can `method` copy more into a buffer than it holds?"
  "true": "A copy's length is not checked against the size of its destination."
  "false": "Every copy is bounded by its destination."
  issue:
    type: security
    label: buffer_overflow
