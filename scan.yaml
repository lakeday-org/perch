  min: 70
- name: cwe_94
  each: method
  where: "**/*"
  ask: "Is `method` vulnerable to code injection?"
  "true": "Outside text is evaluated or compiled as code. `method` or its callers show that input comes from someone less trusted than whoever runs the program: a network request, a message, or a file or upload from another party. The operator's own arguments, environment and configuration are trusted."
  "false": "It never runs outside input as code."
  issue:
    type: security
