- name: cwe_502
  each: method
  where: "**/*"
  ask: "Does `method` deserialize untrusted data unsafely?"
  "true": "Outside data is deserialized in a way that can create arbitrary objects or run code. `method` or its callers show that input comes from someone less trusted than whoever runs the program: a network request, a message, or a file or upload from another party. The operator's own arguments, environment and configuration are trusted."
  "false": "It deserializes only trusted data, or only plain values. Parsing JSON, or YAML with a safe schema, produces plain values and is not this."
  issue:
