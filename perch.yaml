# Rules perch checks on a scan. Each one is a question put to a model about one file or one method, so these are the
# things a parser cannot prove: whether a listing honors a filter, whether prose reads like a person wrote it, whether a
# behavior is asserted anywhere. Editing a rule's wording re-asks it; leaving it alone costs nothing.

# The example applications have deliberate bugs for scanner and workflow verification.
# Keep it out of ordinary repository scans.
ignore:
  - test/fixtures/**/*

rules:
  - name: cli-honors-api-configuration
    where: src/cli.js
    ensure: >-
      The scan and check commands pass their configured environment to
      configuredSystemOne. Passing the unconfigured environment, or omitting
      that client setup from either command, breaks this rule.
  - name: client-honors-api-configuration
    where: src/cloud-client.js
    ensure: >-
      When PERCH_BASE_URL is set, scans use PERCH_API_KEY, falling back to
      TYPESAFE_API_KEY, and pass PERCH_BASE_URL and PERCH_MODEL_ID to
      createSystemOne. PERCH_BASE_URL takes precedence over a saved Cloud login.
  - name: configured-endpoint-is-exact
    where: src/systemone.js
    ensure: >-
      Read request inside createSystemOne. It hands baseUrl to fetchImpl as it
      was given. Building the request URL from baseUrl by adding a route such as
      /systemone, trimming a trailing slash, or replacing its path or query
      breaks this rule.

  - name: prose-not-generated
    where: "**/*.md"
    ensure: >-
      Read the first six prose paragraphs. They read as one person's plain
      notes. Any of these breaks the rule: a list whose every item opens with a
      bolded label and a colon, a paragraph that restates its heading before
      saying anything, a closing line that sums up what was just said, three
      adjectives or three parallel phrases in a row for rhythm, or stock words
      such as seamless, robust, comprehensive, powerful, leverage, delve and
      It's worth noting.
    except: skill.md
    min: 65

  - name: docs-succinct
    where: "**/*.md"
    ensure: >
      Documentation is kept succinct and deliberate. No follow ups, em-dashes,
      and meaningless statements
    min: 60

  - name: closed-never-listed
    where: callers of issues
    ensure: >-
      Findings this method prints, to stdout or to Perch Cloud, go through
      visibleFindings first, so a closed issue is not listed. Printing findings
      as store.issues or a scan gave them breaks this rule. A method that only
      computes on findings, or returns them to its caller, prints nothing and
      satisfies it.

  - name: one-way-into-the-log
    where: mentions .jsonl
    # The store is the one place that opens them, so its own methods are not asked.
    except: src/store.js
    ensure: >-
      This method reads and writes the .jsonl result files by calling the store:
      readLines, writeLines, recordScan or indexes. Calling readFile, writeFile
      or appendFile on a .jsonl path here breaks this rule.

  - name: issues-closable
    where: "test/**/*.js"
    each: test
    ensure_present: >-
      A call to main with close, an issue id and --reason, followed by a call to
      main with issues and an expect that what it printed does not contain that
      id.

  - name: no-dead-command
    where: "src/**/*.js"
    each: method
    ensure_absent: >-
      A command-line flag or argument, such as io.flags.json or io.argument,
      that this method reads into a variable and then never uses.

  - name: no-legacy-fallback
    where: "src/**/*.js"
    each: method
    ensure_absent: >-
      A branch kept to handle a format, key, option or signature that used to be
      supported.

  - name: no-silent-failure
    where: "src/**/*.js"
    each: method
    min: 80
    ensure: >-
      Every catch block and .catch() callback in this method rethrows the
      error, returns it to the caller, or reports it. An empty catch, or one
      that returns a stand-in value such as null, [] or '' so the method
      carries on as if the step had worked, breaks this rule.

  - name: tests-assert-real-behavior
    where: "test/**/*.js"
    ensure: >-
      Read the first three tests in this file. Each calls code imported from
      src/, or runs the perch command, and asserts on what that code returned,
      printed, wrote or sent. A test breaks this rule when its assertions would
      still pass if the code under test did nothing: they check a value the test
      built itself, or a fake's canned reply that never went through code from
      src/. A fake that records what the code sent it is fine to assert on. A
      file that defines no tests satisfies this rule.
  - name: readme-shows-not-tells
    where: README.md
    ensure: >-
      The README shows the tool working in the first screen: a screenshot, a GIF
      or a screencast, not only a fenced block of terminal text.
  - name: readme-lists-setup
    where: README.md
    ensure: >-
      The README shows how to install the perch skill into a coding assistant,
      with the command for every assistant perch supports, after the install
      section and before the section on writing your own rules.
  - name: no-filler-tails
    where: "{README.md,skill.md,docs/**/*.md}"
    ensure: >-
      Read the sentence that directly follows each of the page's first four
      fenced blocks, and the last sentence of the page. Each tells the reader
      something the block above it did not show. A sentence telling them to run
      the command just shown, restating what the block printed, or summing up
      the section breaks this rule. So does a link whose whole label is a
      gesture, such as What it says or Every field. A block followed by a
      heading, a table or another block has no such sentence and satisfies the
      rule.
    min: 65
  # Bounded to the first such block on purpose. Asked of a whole page, this reads 61% on a page whose every command shows its
  # output and 66% on a longer one, because it is then a question about whether any counterexample exists, and a longer page
  # makes that likelier whatever the prose does.
  - name: docs-show-output
    where: "{README.md,skill.md,docs/**/*.md}"
    ensure: >-
      Find the first fenced block on the page with a line that runs perch, such
      as `$ perch scan` or `perch check src/a.js`. That block, or the block
      right after it, also shows lines the command printed. A command shown with
      nothing it printed breaks this rule. Skip a usage line with a placeholder
      in angle or square brackets, such as `perch scan [options]`, and skip
      install lines and exports. A page with no such block satisfies the rule.
  - name: docs-headings-name-things
    where: "{README.md,skill.md,docs/**/*.md}"
    ensure: >-
      Every heading names a task or a thing. A heading phrased as a question the
      page answers, such as What it writes or Why use this, breaks this. So does
      one that is a sentence or a fragment of prose, such as Code perch does not
      read, Rewording what perch itself asks, One issue opened up, or Answers
      that are not yes-or-no.
    # Floored at 75. docs/cli.md reads in the sixties with headings that are all plain noun phrases: perch scan, Exit codes.
    # The real ones read in the eighties and nineties.
    min: 75
  # Judges the opening rather than the page. Worded as a claim about every sentence, it ranked pages by length and nothing else:
  # a page rewritten entirely in 34-word run-ons read 92% and the same page in short sentences read 88%.
  - name: docs-sentences-are-short
    where: "{README.md,skill.md,docs/**/*.md}"
    ensure: >-
      Skip the frontmatter between the `---` markers at the top. Read the first
      four prose paragraphs of the body; headings, tables, lists and fenced
      blocks are not prose. Each sentence in them is under twenty-five words. A
      sentence of twenty-five words or more breaks this rule. So does one that
      chains three or more full clauses, each with its own verb, using commas,
      semicolons and "and". A list of nouns or short phrases inside a sentence
      is not a chain of clauses.
    # A long frontmatter block still pulls this to the mid fifties on a file whose body is clean, so the floor sits above that
    # band. Broken controls read 76 to 85.
    min: 65
  - name: docs-no-next-steps
    where: "{README.md,skill.md,docs/**/*.md}"
    ensure: >-
      Read the last heading on the page and what sits under it. That last
      section says something of its own. A last section titled Where to go next,
      Next steps, See also or Further reading, or one made only of links to
      other pages, breaks this rule.
  - name: intro-anchors-to-a-linter
    where: docs/index.md
    ensure: >-
      Skip the frontmatter between the `---` markers. Read the first sentence
      under the page's first heading. It says perch is a linter and what kind,
      as in perch is a semantic linter. A first sentence that says something
      else, or that describes perch by what other linters fail to do, breaks
      this rule.
  - name: docs-no-antithesis
    where: "{README.md,skill.md,docs/**/*.md}"
    ensure: >-
      Read the first four prose paragraphs of the page. None of their sentences
      says what something is not before saying what it is. A sentence opening
      with "Not a", a clause of the form "X, not Y", or a fragment negating
      something nobody claimed, breaks the rule. Judge only those four
      paragraphs. Saying a thing is excluded, skipped or unsupported is a fact,
      not this construction. Frontmatter between `---` markers at the top of the
      file is metadata rather than prose; skip it.
  # Bounded to what sits under a heading, where this construction lives. Worded over the whole page it reads 51% and 52% on two
  # clean reference pages, which is the length effect the other file rules had.
  - name: docs-no-empty-sentence
    where: "{README.md,skill.md,docs/**/*.md}"
    ensure: >-
      Read the first two sentences under each of this page's first six headings.
      None of them announces what is coming instead of saying it, and none
      points back at something already said without adding to it. "Two things,
      in the order they matter", "There are a few things worth knowing here",
      "Before going further, note the following", "It is worth noting that", and
      "Each check says which it is" all break the rule. Judge only those
      sentences.

  # Bounded to the opening, where an explanation of the basics goes. A control with a paragraph defining "linter" and "model"
  # reads 81%; a clean page reads 51% at worst, so the floor sits between.
  - name: docs-assumes-a-developer
    where: "{README.md,skill.md,docs/**/*.md}"
    min: 60
    ensure: >-
      The reader is a developer who already uses coding assistants. Read the
      first four prose paragraphs. None of them explains what a linter, a model,
      a coding assistant, a skill, JSON, git or CI is, and none opens by
      narrating what a reader or a tool would get wrong before saying what perch
      does. Naming one of those while saying what perch does with it is not
      explaining it. Judge only those four paragraphs.
  - name: scan-covers-only-the-target
    where: src/target.js
    ensure: >-
      resolveTarget returns scope, the target's path relative to the repository
      root, so perch scan docs/ covers docs/ and nothing else. Returning the
      root alone, with scope null for a target below the root, breaks this rule.
  - name: filter-narrows-the-work
    where: src/scan.js
    ensure: >-
      Read the line in stepFor, inside scanRepository, that assigns asked. It
      calls questionsFor with the run's filters as the second argument, and the
      next lines return skip: true when asked is empty, so that method is not
      sent to the model. Passing an empty list in place of filters there, or
      sending a method that has no question left, breaks this rule.
  - name: search-results-are-reported
    where: src/report.js
    ensure: >-
      A search rule's answer is listed, counted and gated like any other rule's.
      Dropping a finding because its unit is a search breaks this.
  - name: scan-filters-by-rule
    where: src/questions.js
    ensure: >-
      The values --filter accepts include the names of the rules in perch.yaml,
      alongside type, kind and severity.
  - name: scan-types-default
    where: src/ask.js
    ensure: >-
      DEFAULT_TYPES, the issue types a scan asks about when perch.yaml sets no
      scan_types, is defect and lint, so no security, refactor or docs question
      is asked by default. A default that includes security breaks this rule.
  - name: scan-types-filter-overrides
    where: src/scan.js
    ensure: >-
      Read typesAsked. The set it returns holds scan_types, or the defaults, and
      every type a --filter type= clause names. Returning scan_types alone, so a
      type named by a filter is not asked, breaks this rule.
  - name: every-type-fails-a-run
    where: src/ask.js
    ensure: >-
      Every question raising an issue fails the run unless it says gate: false.
      No issue type is exempt by being a judgement call.
  - name: codeql-scans-automatically
    where: .github/workflows/codeql.yml
    ensure: >-
      CodeQL initializes with .github/codeql.yml and analyzes the repository on
      pull requests, pushes to main and a weekly schedule, using standard
      ubuntu-latest runners. A workflow that only checks out code, requires a
      manual run or skips the analysis step breaks this rule.
  - name: docs-no-anthropomorphism
    where: "{README.md,skill.md,docs/**/*.md}"
    ensure: >-
      Code, a question, a page or a table is not a person. A sentence giving one
      a mind or a will breaks the rule: the question's own business, the parser
      speaks for it, the rule stopped hedging, the table says, the README knows.
      A tool doing what it does is not this: a scan reads a file, a filter
      narrows a list.
    # Floored at 60. This one is weak: it read 56% on "what fails is the question's own business", the plainest case in the docs,
    # and reads in the low fifties on pages with none. It catches a page full of it and will miss a single sentence.
    min: 60
  - name: docs-no-refactor-history
    where: "{README.md,skill.md,docs/**/*.md}"
    ensure: >-
      The page omits narratives about changes to Perch's own internal
      organization. Justifying an internal refactor, comparing previous and
      current file layouts, or telling users to move files from a retired
      configuration directory breaks this rule. Current paths and settings
      are allowed. The scan category named refactor and examples of scanning
      user code are not histories of Perch's implementation.
  # The reference pages are excepted. scan.md explains how the walk, the questions and the ranking work; issues.md explains what
  # every column means and what the floor does. Explaining a design is what those pages are for, and this rule cannot tell that
  # from arguing for one: it reads 72 to 77 on both after the arguing is cut, against 71 on a task page with a decision argued
  # into it deliberately. The pages it does hold are the ones that tell you to do something.
  - name: docs-no-rationale
    where: "{README.md,skill.md,docs/**/*.md}"
    ensure: >-
      The page says what perch does and how to use it. A passage arguing for a
      design decision belongs in a commit message: weighing one option against
      another, the cost of being wrong, why this was chosen over the
      alternative. Saying what a setting does and what happens when it is off is
      not this.
    # Floored at 70. A clean page reads in the fifties and a page with a decision argued into it reads 71, so the band between is
    # where the rule cannot tell them apart.
    min: 70
    except: [docs/scan.md, docs/issues.md]
