# Rules perch checks on a scan. Each one is a question put to a model about one file or one method, so these are the
# things a parser cannot prove: whether a listing honors a filter, whether prose reads like a person wrote it, whether a
# behavior is asserted anywhere. Editing a rule's wording re-asks it; leaving it alone costs nothing.

# Code perch does not read at all. perch-example is an order service with a bug in every method, kept so the docs can show real
# output; being told about them on every run is noise nobody acts on.
ignore:
  - perch-example/**

rules:
  - name: prose-not-generated
    where: "**/*.md"
    ensure: >
      The file does not sound AI generated
    except: skill.md
    min: 65

  - name: docs-succinct
    where: "**/*.md"
    ensure: >
      Documentation is kept succinct and deliberate. No follow ups, em-dashes,
      and meaningless statements
    min: 60

  - name: closed-never-listed
    where: callers of issues
    ensure: >
      This method passes the findings through visibleFindings before a person
      sees them, or it is not producing a list for a person to read.

  - name: one-way-into-the-log
    where: mentions .jsonl
    ensure: >-
      This method reads and writes the results files through the store, not by
      opening them itself.

  - name: env-read-once
    where: "src/**/*.js"
    except: "src/cli.js"
    each: method
    ensure: >-
      This method does not read configuration out of process.env. Reading the
      environment is the command line's job, and everything below it is passed
      the values. Handing the environment to a child process is not this.

  - name: issues-closable
    where: "test/**/*.js"
    each: test
    ensure_present: >
      A test that closes an issue with a reason and then asserts it is gone from
      the default list.

  - name: no-dead-command
    where: "src/**/*.js"
    each: method
    ensure_absent: >
      A command or flag that is parsed and then never used.

  - name: no-legacy-fallback
    where: "src/**/*.js"
    each: method
    ensure_absent: >-
      A branch kept to handle a format, key, option or signature that used to be
      supported.

  - name: no-silent-failure
    where: "src/**/*.js"
    each: method
    ensure_absent: >-
      A catch that returns a default in place of the error, or a ?? or ||
      standing in for a call that failed. A default for a value that was never
      set is not this.

  - name: tests-assert-real-behavior
    where: "test/**/*.js"
    ensure: >
      Tests assert on the code under test, not on mocks they set up or values
      they built.
  - name: readme-shows-not-tells
    where: README.md
    ensure: >-
      The README shows the tool working in the first screen: a screenshot, a GIF
      or a screencast, not only a fenced block of terminal text.
  - name: readme-lists-setup
    where: README.md
    ensure: >-
      The README shows how to install the perch skill into a coding assistant,
      with the command for every assistant perch supports, after the install
      section and before the section on writing your own rules.
  - name: no-filler-tails
    where: "{README.md,docs/**/*.md}"
    ensure: >-
      Every sentence carries information the reader does not already have. A
      line telling them to do the obvious after a command block, a link whose
      only label is a gesture such as What it says or Every field, or a closing
      sentence that summarises the block above it, all break this.
    min: 65
  - name: docs-show-output
    where: "{README.md,docs/**/*.md}"
    ensure: >-
      A command block shows what the command prints. A fenced block holding only
      commands, with no output under them and no output block following, breaks
      this.
  - name: docs-headings-name-things
    where: "{README.md,docs/**/*.md}"
    ensure: >-
      Every heading names a task or a thing. A heading phrased as a question the
      page then answers, such as What it costs to run or What it writes or Why
      use this, breaks this.
  - name: docs-sentences-are-short
    where: "{README.md,docs/**/*.md}"
    ensure: >-
      Sentences in prose stay under about twenty words. A sentence joining three
      clauses with commas, or a colon followed by a list of five or more things,
      breaks this. A table cell and a list item are reference material and are
      not prose for this purpose.
  - name: docs-no-next-steps
    where: "{README.md,docs/**/*.md}"
    ensure: >-
      No section exists to list links the navigation already shows. A closing
      Where to go next, Next steps, or See also that repeats the sidebar breaks
      this.
  - name: intro-anchors-to-a-linter
    where: docs/index.md
    ensure: >-
      The first sentence says perch is a linter and what kind. Leaving what it
      is to a section further down breaks this, and so does defining it by what
      other linters fail to do.
  - name: docs-no-antithesis
    where: "{README.md,docs/**/*.md}"
    ensure: >-
      A sentence states what is true without first stating what is not.
      Constructions used for rhythm rather than information break this: Not a
      located defect, Two numbers not three, The number is belief not severity,
      Nothing in your working tree, and any short fragment negating something
      before the real statement.
