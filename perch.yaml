# Rules perch checks with `perch lint`. Each one is a question put to a model about one file or one method, so these are the
# things a parser cannot prove: whether a comment says why, whether a listing honours a filter, whether a behaviour is asserted
# anywhere. Editing a rule's wording re-asks it; leaving it alone costs nothing.

- name: prose-not-generated
  where: "**/*.md"
  ensure: >
    The file does not sound AI generated

- name: docs-succint
  where: "**/*.md"
  ensure: >
    Documentation is kept succint and deliberate. No follow ups, em-dashes, and meaningless statements

- name: comment-says-why
  where: "src/**/*.js"
  each: method
  ensure: >
    methods carry a comment that tells a human reader something the code does
    A comment that narrates the steps below it, or restates the method's name as a sentence,
    breaks this rule.

- name: closed-never-listed
  over: callers of issues
  ensure: >
    This method passes the findings through visibleFindings before a person sees them, or it is not
    producing a list for a person to read.

- name: one-way-into-the-log
  over: writers of events.jsonl
  ensure: >
    This method appends through store.appendEvent rather than writing the file itself.

- name: env-read-once
  over: "src/**/*.js"
  except: "src/cli.js"
  each: method
  ensure: >
    This method does not read process.env. Reading the environment is the command line's job, and
    everything below it is passed the values.

- name: issues-closable
  behaviour: >
    An issue can be closed with a reason, and a closed issue stops appearing in the default list.
  cite: "test/**/*.js"

